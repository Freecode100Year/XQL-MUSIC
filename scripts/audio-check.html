<!doctype html><html lang="en"><meta charset="utf-8"><title>Audio regression checks</title>
<style>body{font:16px system-ui;padding:24px}li{margin:12px}button{padding:14px}</style>
<h1>Audio regression checks</h1><button id="run">Run offline checks</button><ol id="results"></ol>
<script type="module">
import { AdvancedAudio } from '/src/audio/advanced.ts';
import { SpatialOrbit } from '/src/audio/orbit.ts';
import { sanitizeAdvanced } from '/src/audio/settings.ts';
const results = document.querySelector('#results');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const rms = (samples, start=12000) => Math.sqrt(samples.slice(start).reduce((sum,v)=>sum+v*v,0)/(samples.length-start));
async function render(settings={}, channels=2, left=.15, right=.08) {
  const ctx = new OfflineAudioContext(channels, 48000, 48000);
  const buffer = ctx.createBuffer(2,48000,48000);
  for(let i=0;i<48000;i++) { buffer.getChannelData(0)[i]=left*Math.sin(2*Math.PI*440*i/48000); buffer.getChannelData(1)[i]=right*Math.sin(2*Math.PI*880*i/48000); }
  const source=ctx.createBufferSource();source.buffer=buffer;
  const engine=new AdvancedAudio(ctx);const config=sanitizeAdvanced(settings);engine.update(config);
  source.connect(engine.input);engine.connectDestination(engine.output,config,channels); source.start();
  return ctx.startRendering();
}
document.querySelector('#run').onclick=async()=>{
  results.replaceChildren(); document.querySelector('#run').disabled=true;
  const test=async(name,fn)=>{const li=document.createElement('li');try{await fn();li.textContent='PASS: '+name;}catch(e){li.textContent='FAIL: '+name+' — '+e.message;}results.append(li);};
  await test('Safe stereo preserves both channels',async()=>{const b=await render();const l=rms(b.getChannelData(0)),r=rms(b.getChannelData(1));assert(l>.01&&r>.01,'audible channels');assert(l>r,'channel balance preserved');});
  await test('Limiter caps an overdriven output',async()=>{const b=await render({channelGains:[2,2]},2,1,1);let peak=0;for(let c=0;c<2;c++)for(const v of b.getChannelData(c))peak=Math.max(peak,Math.abs(v));assert(peak<=.9701,'peak '+peak);});
  await test('Voice clarity remains finite and audible',async()=>{const b=await render({dialogue:1});assert(b.getChannelData(0).every(Number.isFinite),'nonfinite samples');assert(rms(b.getChannelData(0))>0,'audio not silent');});
  await test('Risky saved settings migrate to safe values',async()=>{const s=sanitizeAdvanced({system:'7.2',limiter:false,normalize:true,smartMono:true,tone:[12,12,12,12,12,12,12],channelGains:[2,2],routing:[1,0],rearDirect:true,rearInvert:true,splitBass:true});assert(s.system==='2.0'&&s.limiter&&!s.normalize&&!s.smartMono,'safe mode');assert(s.tone.every(v=>v===0)&&s.channelGains.every(v=>v===1),'neutral gains');assert(s.routing.every((v,i)=>v===i)&&!s.rearDirect&&!s.rearInvert&&!s.splitBass,'safe routing');});
  await test('HRTF trajectories produce finite moving stereo',async()=>{
    for(const trajectory of ['circle','orbital','pendulum']){
      const ctx=new OfflineAudioContext(2,48000*8,48000); const orbit=new SpatialOrbit(ctx);orbit.update(.12,.85,trajectory);
      assert(orbit.panner.panningModel==='HRTF','HRTF model'); const source=ctx.createOscillator();source.frequency.value=440;
      const gain=ctx.createGain();gain.gain.value=.1;source.connect(gain).connect(orbit.input);orbit.output.connect(ctx.destination);source.start();
      const b=await ctx.startRendering(); const l=b.getChannelData(0),r=b.getChannelData(1);
      assert(l.every(Number.isFinite)&&r.every(Number.isFinite),'finite samples'); let difference=0;for(let i=12000;i<l.length;i++)difference+=Math.abs(l[i]-r[i]);assert(difference/l.length>.005,'spatial difference '+trajectory);
      orbit.dispose();
    }
  });
  const done=document.createElement('p'); done.textContent='DONE'; results.append(done);document.querySelector('#run').disabled=false;
};
</script></html>
